name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: "3.11"
  IMAGE_NAME: guardian-ssdlc

jobs:

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
      - name: Install lint deps
        run: pip install ruff mypy types-pyyaml
      - name: ruff check
        run: ruff check src/ tests/ --output-format=github
      - name: ruff format check
        run: ruff format src/ tests/ --check
      - name: mypy
        run: mypy src/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: pip install -e ".[dev]"
      - name: Run pytest
        run: |
          pytest tests/ --tb=short --cov=src             --cov-report=xml:coverage.xml             --junitxml=junit.xml -v
        env:
          GOOGLE_API_KEY: test-placeholder
      - name: Upload coverage to Codecov
        if: matrix.python-version == env.PYTHON_DEFAULT
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: junit.xml
          retention-days: 7

  security-self-scan:
    name: Guardian Self-Scan
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Secret scan source tree
        run: |
          python -c "
import json, sys
from src.server.tools.secret_scanner import run_secret_scan
r = run_secret_scan(target="src/")
with open("secret_scan_report.json", "w") as f: json.dump(r, f, indent=2)
crit = r["summary"]["severity_breakdown"].get("CRITICAL", 0)
if crit > 0:
    print(f"::error::Found {crit} CRITICAL secret(s)!")
    sys.exit(1)
print(f"Secret scan CLEAN — {r["summary"]["files_scanned"]} files scanned")
"
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: "*_report.json"
          retention-days: 30

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify non-root user
        run: |
          UID_IN_CONTAINER=$(docker run --rm ${{ env.IMAGE_NAME }}:ci-test id -u)
          [ "$UID_IN_CONTAINER" != "0" ] && echo "Non-root OK (uid=$UID_IN_CONTAINER)" || (echo "::error::Running as root!" && exit 1)
      - name: Health check
        run: docker run --rm ${{ env.IMAGE_NAME }}:ci-test python -c "from src.server.main import mcp; print(chr(10) + chr(9) + chr(10) + chr(9) + chr(10) + chr(9) + chr(10))"
