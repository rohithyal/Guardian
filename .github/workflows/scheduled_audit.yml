name: Scheduled Security Audit

on:
  schedule:
    - cron: '0 8 * * 1'   # Every Monday 08:00 UTC
  workflow_dispatch:

jobs:

  weekly-sca:
    name: Weekly Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Run SCA + Secret scan
        id: scan
        run: |
          python - <<'PYEOF'
          import json, os, sys
          from src.server.tools.sca import run_sca
          from src.server.tools.secret_scanner import run_secret_scan

          sca = run_sca('CONTENT:requests==2.28.0\npyyaml==5.3\nflask==2.2.0\n')
          with open('weekly_sca.json', 'w') as f:
              json.dump(sca, f, indent=2)

          secrets = run_secret_scan(target='src/')
          with open('weekly_secrets.json', 'w') as f:
              json.dump(secrets, f, indent=2)

          crit_sca = sca['summary'].get('critical', 0)
          crit_sec = secrets['summary']['severity_breakdown'].get('CRITICAL', 0)
          risk_rating = sca['summary']['risk_rating']

          gh_env = os.environ.get('GITHUB_ENV', '/dev/null')
          with open(gh_env, 'a') as env:
              env.write(f'SCA_CRITICAL={crit_sca}\n')
              env.write(f'SECRET_CRITICAL={crit_sec}\n')
              env.write(f'SCA_RISK={risk_rating}\n')

          print(f'SCA risk={risk_rating} | Secrets critical={crit_sec}')
          PYEOF

      - name: Open GitHub Issue on CRITICAL findings
        if: env.SCA_CRITICAL != '0' || env.SECRET_CRITICAL != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sca = JSON.parse(fs.readFileSync('weekly_sca.json', 'utf8'));
            const vulnLines = (sca.vulnerable_packages || [])
              .slice(0,8)
              .map(p => `| ${p.package} | ${p.installed_version} | ${p.highest_severity} | ${p.vuln_count} |`)
              .join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 [Guardian] Weekly Audit — ${process.env.SCA_RISK} risk detected`,
              body: `## Guardian Weekly Security Audit\n\n**SCA Risk:** ${process.env.SCA_RISK} | **Secret Findings:** ${process.env.SECRET_CRITICAL} critical\n\n### Vulnerable Packages\n| Package | Version | Severity | Count |\n|---------|---------|----------|-------|\n${vulnLines}\n\n*Auto-generated by Guardian S-SDLC · ${new Date().toISOString().split('T')[0]}*`,
              labels: ['security', 'dependencies'],
            });

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-audit-${{ github.run_id }}
          path: "weekly_*.json"
          retention-days: 90
